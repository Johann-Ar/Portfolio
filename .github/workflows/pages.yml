# Publie le site compilé sur GitHub Pages (https://johann-ar.github.io/Portfolio/), en plus de Vercel.
# GitHub Pages ne compile rien : sans ce workflow, il servait les fichiers sources (index.html non compilé, page vide).
# Le site y est publié dans le dossier /Portfolio/ (BASE_PATH, pour les liens de la page 404) ; l'adresse de référence
# (canonical, sitemap) reste celle de Vercel.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /Portfolio/
      # pas de mise en ligne si FR/EN recharge la page (scripts/test-lang.mjs)
      - run: npx playwright install --with-deps chromium
      - run: npm run test:lang
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
